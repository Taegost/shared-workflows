# =============================================================================
# Reusable Docker Build and Publish Workflow
# =============================================================================
# Called by consumer repos via workflow_call. Builds the Docker image and pushes
# it to Docker Hub.
#
# NOTE: This is a reusable workflow. Triggers are defined by the caller.
# The caller must pass schedule_trigger=true when the original event is
# 'schedule' so this workflow can apply latest-only tagging.
#
# REQUIRED SECRETS (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME   — your Docker Hub username (org-level secret)
#   DOCKERHUB_TOKEN      — Docker Hub access token, NOT your password (org-level secret)
#                          Generate at: hub.docker.com → Account Settings → Security
#   DOCKERHUB_IMAGENAME  — image name, ex devops-toolbox (repo-level secret)
#
# TAGGING STRATEGY:
#   Push to main:    latest, sha-<short-commit>
#   Tag v1.2.3:      1.2.3, 1.2, 1, latest, sha-<short-commit>
#   Pull request:    no push, build validation only
#   Scheduled:       latest, sha-<short-commit>
# =============================================================================

name: Build and Publish

on:
  workflow_call:
    inputs:
      schedule_trigger:
        description: 'Set to true when caller is triggered by schedule (applies latest-only tagging)'
        required: false
        default: false
        type: boolean
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      DOCKERHUB_IMAGENAME:
        required: true
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_IMAGENAME }}

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for Cosign OIDC-based signing against Sigstore/Fulcio
      id-token: write

    steps:

      # -----------------------------------------------------------------------
      # Tag format validation
      # Fails immediately if the Git tag is not valid semver (vMAJOR.MINOR.PATCH).
      # Prevents a silent partial push where only the SHA tag is published.
      # -----------------------------------------------------------------------
      - name: Validate tag format
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not valid semver (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Checkout
      # fetch-depth: 0 is required for the metadata action to correctly resolve
      # semver tags from the full Git history.
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # -----------------------------------------------------------------------
      # Cosign — image signing via Sigstore/Fulcio
      # Skipped on PRs since there is nothing to sign (no push occurs).
      # -----------------------------------------------------------------------
      - name: Install Cosign
        if: ${{ !startsWith(github.ref, 'refs/pull/') }}
        uses: sigstore/cosign-installer@v4.1.1

      # -----------------------------------------------------------------------
      # Multi-arch setup
      # QEMU provides CPU emulation so amd64 runners can build arm64 images.
      # Buildx is the extended Docker build client that enables multi-platform
      # builds, layer caching, and other BuildKit features.
      # -----------------------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      # -----------------------------------------------------------------------
      # Docker Hub login
      # Skipped on PRs — credentials are not needed for a build-only run, and
      # PRs from forks do not have access to secrets anyway.
      # Uses DOCKERHUB_TOKEN (access token), NOT DOCKERHUB_PASSWORD.
      # -----------------------------------------------------------------------
      - name: Log in to Docker Hub
        if: ${{ !startsWith(github.ref, 'refs/pull/') }}
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Image metadata and tags
      # Derives tags and labels from the Git context automatically:
      #   - Semver tags from Git version tags (v1.2.3 → 1.2.3, 1.2, 1)
      #   - 'latest' on pushes to main and scheduled runs
      #   - Short SHA tag on every build for traceability
      # -----------------------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Semver tags from Git version tags (e.g. v1.2.3)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # 'latest' on pushes to main, version tags, and scheduled runs
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/') || inputs.schedule_trigger }}
            # Short SHA for full traceability on every build
            type=sha,format=short

      # -----------------------------------------------------------------------
      # Verify semver tags were generated
      # Fails if metadata-action produced no non-SHA tags, which happens when
      # the Git tag is not valid semver. Catches edge cases the validate-tag
      # job may not cover (e.g. manual workflow_dispatch with a bad tag).
      # -----------------------------------------------------------------------
      - name: Verify semver tags were generated
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAGS="${{ steps.meta.outputs.tags }}"
          # Check for at least one full MAJOR.MINOR.PATCH version tag (e.g. :1.2.3).
          # The metadata-action strips the "v" prefix from semver patterns, so we
          # match the numeric version, not the Git tag format. This catches cases
          # where metadata-action produced no version tags (e.g. invalid tag context).
          # A simple "grep -qv sha-" would falsely pass on non-SHA tags like "latest".
          if ! echo "$TAGS" | grep -qP ':\d+\.\d+\.\d+'; then
            echo "::error::No semver tags generated — verify your tag follows vMAJOR.MINOR.PATCH"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Build and push
      # - Multi-platform: linux/amd64 + linux/arm64
      # - Push is skipped on PRs (validation build only)
      # - GHA cache keeps rebuild times fast for unchanged layers
      # - context: . is explicit so .dockerignore is respected
      # -----------------------------------------------------------------------
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ !startsWith(github.ref, 'refs/pull/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------------------------
      # Cosign image signing
      # Signs the published image digest against the Sigstore/Fulcio public
      # transparency log, providing cryptographic proof that this image was
      # built by this pipeline and has not been tampered with.
      # Skipped on PRs since no image was pushed.
      # -----------------------------------------------------------------------
      - name: Sign the published Docker image
        if: ${{ !startsWith(github.ref, 'refs/pull/') }}
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # Sign the digest once (not per-tag). All tags point to the same digest,
        # so a single signature covers every tag. When a tag like "latest" later
        # drifts to a new digest, the old signature correctly does not apply.
        # This avoids redundant OIDC token exchanges and Rekor transparency log entries.
        run: cosign sign --yes --oidc-provider=github-actions ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}

      # -----------------------------------------------------------------------
      # Docker Hub README sync
      # Keeps the Docker Hub repository description in sync with README.md.
      # Skipped on PRs — there is nothing to sync before a merge.
      # -----------------------------------------------------------------------
      - name: Sync README to Docker Hub
        if: ${{ !startsWith(github.ref, 'refs/pull/') }}
        uses: peter-evans/dockerhub-description@v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./README.md
          short-description: ${{ github.event.repository.description }}
          enable-url-completion: true
